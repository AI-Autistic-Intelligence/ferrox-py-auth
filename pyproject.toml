[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ferrox-py-auth"
version = "1.1.1"
description = "IAM, SSO, GDPR and RBAC suite for Ferrox ecosystem."
authors = [{ name = "AI-Autistic-Intelligence" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ferrox-py>=1.1.0",
    "pydantic>=2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.9.0",
    "ruff>=0.3.0"
]

[tool.mypy]
strict = true
ignore_missing_imports = true
